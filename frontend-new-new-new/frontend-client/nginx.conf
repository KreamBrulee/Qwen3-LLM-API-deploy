# nginx config for serving the StackMind static frontend.
# This is a server block that gets dropped into nginx's conf.d directory.
# It only serves files — the frontend talks to the API directly from the
# browser (the API base URL is configured in the UI), so there is no proxy here.

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Don't cache index.html so UI updates show up immediately on refresh.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Cache the static assets (css/js) for a day. They change rarely; bump the
    # value or rename files if you need to force a refresh.
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Everything else: serve the file if it exists, otherwise fall back to
    # index.html (keeps the single-page app working on any path).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic gzip so the text assets transfer smaller.
    gzip             on;
    gzip_types       text/css application/javascript image/svg+xml;
    gzip_min_length  512;
}
